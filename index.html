<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页计算器 | TOP Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator">
    <!-- 显示屏区域：包含历史输入/运算符 和 当前数值 -->
    <div class="display">
      <div id="previous-operand" class="previous-operand"></div>
      <div id="current-operand" class="current-operand">0</div>
    </div>

    <!-- 按键区域 -->
    <div class="buttons">
      <button class="btn btn-action" id="clear">AC</button>
      <button class="btn btn-action" id="delete">DEL</button>
      <button class="btn btn-operator" data-operator="/">÷</button>
      <button class="btn btn-operator" data-operator="*">×</button>

      <button class="btn btn-number">7</button>
      <button class="btn btn-number">8</button>
      <button class="btn btn-number">9</button>
      <button class="btn btn-operator" data-operator="-">-</button>

      <button class="btn btn-number">4</button>
      <button class="btn btn-number">5</button>
      <button class="btn btn-number">6</button>
      <button class="btn btn-operator" data-operator="+">+</button>

      <button class="btn btn-number">1</button>
      <button class="btn btn-number">2</button>
      <button class="btn btn-number">3</button>
      <button class="btn btn-equals" id="equals">=</button>

      <button class="btn btn-number btn-zero">0</button>
      <button class="btn btn-number" id="decimal">.</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
